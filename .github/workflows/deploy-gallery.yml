# 공개 갤러리 배포 — prototypes.json 에서 public: true 인 프로토타입만 빌드해 GitHub Pages 에 올린다.
# 수동 실행뿐이다(Actions 탭의 Run workflow) — push 로는 돌지 않는다. 공개는 Jay 가 정한다(CLAUDE.md 불변 규칙 6).
# 처음 한 번: 리포 Settings → Pages → Source 를 "GitHub Actions" 로 둔다.
name: Deploy gallery

on:
  workflow_dispatch:

# 배포가 겹치면 앞선 것을 버린다
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7.0.1

      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          # 리포 루트에 package.json 이 없다 — 프로토타입마다 따로 설치한다
          package-manager-cache: false

      # 프로토타입마다 npm ci → npm run build → _site/<slug>/ , 목록은 _site/index.html
      # public: true 가 아닌 것은 빌드하지도 올리지도 않는다(무엇이 빠졌는지 로그에 찍힌다)
      - name: 갤러리 빌드
        run: node tools/build-site.mjs

      - name: 산출물 올리기
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 배포 작업에만 쓰기 권한을 준다
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5.0.1
